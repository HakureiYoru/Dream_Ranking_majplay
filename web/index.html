<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Majplay Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="background.css">
</head>
<body class="bg-light py-5">
  <div class="container glass-panel text-center">
    <h1 class="display-6 fw-bold mb-4 text-primary">Majplay Challenge</h1>
    <div class="progress-wrapper mx-auto">
      <div class="progress-background shadow-sm">
        <div id="progress-fill"></div>
        <div class="labels">
          <span class="practice">Free</span>
          <span class="challenge">Challenge Time</span>
        </div>
      </div>
    </div>
    <div id="info" class="mt-3 fw-bold text-dark"></div>
    <div id="countdown" class="text-muted small"></div>
  </div>

  <div class="container glass-panel my-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 text-secondary">Ranking</h2>
      <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#inputCollapse" aria-expanded="false" aria-controls="inputCollapse">
        填写新成绩
      </button>
    </div>

    <div class="collapse" id="inputCollapse">
      <form id="record-form" class="row gy-2 gx-3 align-items-end">
        <div class="col-md">
          <label class="form-label" for="player">玩家ID</label>
          <input id="player" class="form-control" required />
        </div>
        <div class="col-md">
          <label class="form-label" for="score">分数</label>
          <input id="score" type="number" min="0" max="101" step="0.01" class="form-control" required />
        </div>
        <div class="col-md">
          <label class="form-label" for="song">曲目</label>
          <select id="song" class="form-select"></select>
        </div>
        <div class="col-md">
          <label class="form-label" for="difficulty">难度</label>
          <select id="difficulty" class="form-select"></select>
        </div>
        <div class="col-md-auto">
          <button type="submit" class="btn btn-primary w-100">提交</button>
        </div>
      </form>
      <div class="mt-3 d-flex gap-2">
        <button id="clear" class="btn btn-warning btn-sm">清空记录</button>
        <button id="delete" class="btn btn-danger btn-sm">删除选择</button>
        <button id="export" class="btn btn-success btn-sm">导出 CSV</button>
      </div>
    </div>

    <table id="ranking-table" class="table table-striped table-hover mt-4 ranking-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家ID</th>
          <th>分数</th>
          <th>曲目</th>
          <th>难度</th>
          <th>时间</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
