<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Majplay Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
</head>

<body class="fantasy-bg">
  <div class="main-content">
    <div class="fantasy-header">
      <h1 class="fantasy-title">Majplay Challenge</h1>
      <div class="fantasy-timer">
        <span class="timer-label">距离该周期结算还有</span>
        <span id="fantasy-countdown" class="timer-value">00:00:00</span>
      </div>
    </div>

    <div class="fantasy-top1-row">
      <div class="fantasy-top1-card" id="top1-0"></div>
      <div class="fantasy-top1-card" id="top1-1"></div>
      <div class="fantasy-top1-card" id="top1-2"></div>
    </div>

    <!-- 悬浮按钮 -->
    <button id="floating-form-btn" class="fantasy-floating-btn">＋</button>

    <!-- 填写成绩弹窗 -->
    <div id="fantasy-modal-mask" class="fantasy-modal-mask" style="display:none;"></div>
    <div id="fantasy-modal" class="fantasy-modal" style="display:none;">
      <div class="fantasy-modal-content">
        <button id="fantasy-modal-close" class="fantasy-modal-close">×</button>
        <h2 class="fantasy-modal-title">填写新成绩</h2>
        <form id="record-form" class="fantasy-form">
          <input id="player" class="fantasy-input" placeholder="玩家ID" required />
          <input id="score" type="number" min="0" max="101" step="0.01" class="fantasy-input" placeholder="分数"
            required />
          <div class="apfc-checkbox-group">
            <div class="apfc-label-title">分数属性：</div>
            <label class="apfc-label"><input type="checkbox" id="ap-checkbox" /> AP</label>
            <label class="apfc-label"><input type="checkbox" id="fc-checkbox" /> FC</label>
          </div>
          <select id="song" class="fantasy-select"></select>
          <div class="fantasy-diff-group">
            <select id="difficulty" class="fantasy-select">
              <option value="Master">Master</option>
              <option value="Expert">Expert</option>
            </select>
          </div>
          <button type="submit" class="fantasy-btn-submit">提交</button>
        </form>
        <div class="fantasy-form-actions">
          <button id="clear" class="fantasy-btn-warning">清空记录</button>
          <button id="export" class="fantasy-btn-success">导出 CSV</button>
        </div>
      </div>
    </div>

    <div class="fantasy-ranking-panel">
      <div class="song-filter-container">
        <label for="song-filter" class="filter-label">曲目筛选：</label>
        <select id="song-filter" class="fantasy-select song-filter">
          <option value="all">显示所有歌曲</option>
        </select>
      </div>
      <table id="ranking-table" class="fantasy-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>玩家ID</th>
            <th>分数</th>
            <th>曲目</th>
            <th>难度</th>
            <th>时间</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <!-- 历史结算表会由JS自动插入 -->
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
