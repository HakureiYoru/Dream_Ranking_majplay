<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>打榜时间进度</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
<div class="container text-center">
  <h1 class="h4 mb-4">打榜时间进度</h1>
  <div class="progress-wrapper mx-auto">
    <div class="progress-background shadow-sm">
      <div id="progress-fill"></div>
      <div class="labels">
        <span class="practice">自由练习时间</span>
        <span class="challenge">打榜时间</span>
      </div>
    </div>
  </div>
  <div id="info" class="mt-3 fw-bold"></div>
  <div id="countdown" class="text-muted"></div>
</div>
<script src="script.js"></script>
</body>
</html>
