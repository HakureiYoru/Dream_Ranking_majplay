<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Majplay Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
</head>

<body class="fantasy-bg">
  <div class="main-content">
    <div class="fantasy-header">
      <div class="arena-title-row">
        <h1 class="fantasy-title">Majplay Challenge</h1>
        <nav class="arena-nav">
          <a class="arena-nav-link" href="arena.html">擂台页</a>
        </nav>
      </div>
      <div class="fantasy-timer">
        <span class="timer-label">距离该周期结算还有</span>
        <span id="fantasy-countdown" class="timer-value">00:00:00</span>
      </div>
    </div>

    <section class="song-board-panel">
      <div class="song-board-grid">
        <div class="song-board-column">
          <div class="fantasy-top1-card song-board-top" id="top1-0"></div>
          <table id="ranking-table-0" class="fantasy-table song-ranking-table" data-song-index="0">
            <colgroup>
              <col class="rank-col">
              <col class="player-col">
              <col class="score-col">
              <col class="diff-col">
            </colgroup>
            <thead>
              <tr>
                <th class="rank-col">排名</th>
                <th class="player-col">玩家ID</th>
                <th class="score-col">分数</th>
                <th class="diff-col">难度</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="song-board-column">
          <div class="fantasy-top1-card song-board-top" id="top1-1"></div>
          <table id="ranking-table-1" class="fantasy-table song-ranking-table" data-song-index="1">
            <colgroup>
              <col class="rank-col">
              <col class="player-col">
              <col class="score-col">
              <col class="diff-col">
            </colgroup>
            <thead>
              <tr>
                <th class="rank-col">排名</th>
                <th class="player-col">玩家ID</th>
                <th class="score-col">分数</th>
                <th class="diff-col">难度</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 悬浮按钮 -->
    <button id="floating-form-btn" class="fantasy-floating-btn">＋</button>

    <!-- 填写成绩弹窗 -->
    <div id="fantasy-modal-mask" class="fantasy-modal-mask" style="display:none;"></div>
    <div id="fantasy-modal" class="fantasy-modal" style="display:none;">
      <div class="fantasy-modal-content">
        <button id="fantasy-modal-close" class="fantasy-modal-close">×</button>
        <h2 class="fantasy-modal-title">填写新成绩</h2>
        <form id="record-form" class="fantasy-form">
          <input id="player" class="fantasy-input" placeholder="玩家ID" required />
          <input id="score" type="number" min="0" max="101" step="0.01" value="100.5" class="fantasy-input" placeholder="分数"
            required />
          <div class="apfc-checkbox-group">
            <div class="apfc-label-title">分数属性：</div>
            <label class="apfc-label"><input type="checkbox" id="ap-checkbox" /> AP</label>
            <label class="apfc-label"><input type="checkbox" id="fc-checkbox" /> FC</label>
          </div>
          <select id="song" class="fantasy-select"></select>
          <div class="fantasy-diff-group">
            <select id="difficulty" class="fantasy-select">
              <option value="Master">Master</option>
              <option value="Expert">Expert</option>
            </select>
          </div>
          <button type="submit" class="fantasy-btn-submit">提交</button>
        </form>
        <div class="fantasy-form-actions">
          <button id="clear" class="fantasy-btn-warning">清空记录</button>
          <button id="export" class="fantasy-btn-success">导出 CSV</button>
        </div>
      </div>
    </div>

    <!-- 历史结算表会由JS自动插入 -->
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
