<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Majplay 本地打榜系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
  <div class="container text-center">
    <h1 class="h4 mb-4">打榜时间进度</h1>
    <div class="progress-wrapper mx-auto">
      <div class="progress-background shadow-sm">
        <div id="progress-fill"></div>
        <div class="labels">
          <span class="practice">自由练习时间</span>
          <span class="challenge">打榜时间</span>
        </div>
      </div>
    </div>
    <div id="info" class="mt-3 fw-bold"></div>
    <div id="countdown" class="text-muted"></div>
  </div>

  <div class="container my-5">
    <h2 class="h5 mb-3">成绩录入</h2>
    <form id="record-form" class="row gy-2 gx-3 align-items-end">
      <div class="col-sm">
        <label class="form-label" for="player">玩家ID</label>
        <input id="player" class="form-control" required />
      </div>
      <div class="col-sm">
        <label class="form-label" for="score">分数</label>
        <input id="score" type="number" min="0" max="101" step="0.01" class="form-control" required />
      </div>
      <div class="col-sm">
        <label class="form-label" for="song">曲目</label>
        <select id="song" class="form-select"></select>
      </div>
      <div class="col-sm">
        <label class="form-label" for="difficulty">难度</label>
        <select id="difficulty" class="form-select"></select>
      </div>
      <div class="col-sm-auto">
        <button type="submit" class="btn btn-primary w-100">提交</button>
      </div>
    </form>
    <div class="mt-3">
      <button id="clear" class="btn btn-warning btn-sm me-2">清空记录</button>
      <button id="delete" class="btn btn-danger btn-sm me-2">删除选择</button>
      <button id="export" class="btn btn-success btn-sm">导出 CSV</button>
    </div>

    <table id="ranking-table" class="table table-striped table-hover mt-3 ranking-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家ID</th>
          <th>分数</th>
          <th>曲目</th>
          <th>难度</th>
          <th>时间</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
