<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majplay Arena</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/arena.css">
</head>

<body class="fantasy-bg arena-page">
  <div class="main-content arena-content">
    <header class="fantasy-header arena-header">
      <div class="arena-title-row">
        <h1 class="fantasy-title">Majplay Arena</h1>
        <nav class="arena-nav">
          <a class="arena-nav-link" href="index.html">打榜页</a>
          <a class="arena-nav-link" href="guess.html">猜曲绘</a>
          <a class="arena-nav-link" href="guess_official.html">官谱猜绘</a>
        </nav>
      </div>
      <div class="arena-subtitle">擂台赛课题展示</div>
    </header>

    <main class="arena-layout">
      <p class="arena-rule-tip">
        对上一位玩家指定的曲子与分数进行挑战，挑战成功即可获得<strong>小立牌一枚</strong>，并可<strong>指定下一曲目</strong>，自己游玩分数线留给后续玩家挑战
      </p>
      <section class="current-topic-panel" aria-labelledby="current-topic-title">
        <h2 id="current-topic-title" class="visually-hidden">当前课题</h2>
        <div id="current-topic" class="current-topic"></div>
      </section>
    </main>
  </div>

  <div class="arena-floating-actions">
    <button id="ui-focus-toggle" type="button" class="arena-floating-btn ui-focus-toggle" title="隐藏界面组件"
      aria-label="隐藏界面组件" aria-pressed="false">
      <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"></path>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
    <button id="clear-topic" type="button" class="arena-floating-btn arena-clear-topic-btn" title="清除课题"
      aria-label="清除课题">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18"></path>
        <path d="M8 6V4h8v2"></path>
        <path d="M6.5 6l1 14h9l1-14"></path>
        <path d="M10 10v6"></path>
        <path d="M14 10v6"></path>
      </svg>
    </button>
    <button id="open-search" type="button" class="arena-floating-btn arena-open-search-btn" title="搜索并设置课题"
      aria-label="搜索并设置课题">＋</button>
  </div>

  <div id="search-modal-mask" class="arena-modal-mask" style="display:none;"></div>
  <div id="search-modal" class="arena-search-modal" style="display:none;" role="dialog" aria-modal="true"
    aria-labelledby="song-search-title">
    <section class="arena-panel search-panel">
      <div class="arena-section-head">
        <h2 id="song-search-title">MajdataNet 搜索</h2>
        <div class="arena-actions">
          <button id="prev-page" type="button" class="fantasy-btn-warning compact-btn">上一页</button>
          <button id="next-page" type="button" class="fantasy-btn-warning compact-btn">下一页</button>
          <button id="search-modal-close" class="arena-modal-close inline-close" type="button">×</button>
        </div>
      </div>

      <form id="song-search-form" class="search-form">
        <input id="song-query" class="fantasy-input" placeholder="曲名 / 作者 / 谱师 / 标签" autocomplete="off">
        <select id="song-sort" class="fantasy-select">
          <option value="">默认排序</option>
          <option value="title">曲名</option>
          <option value="artist">艺术家</option>
          <option value="uploader">上传者</option>
        </select>
        <button type="submit" class="fantasy-btn-submit">搜索</button>
      </form>

      <div class="selected-topic-strip" aria-labelledby="selected-song-title">
        <div class="arena-section-head selected-topic-head">
          <h2 id="selected-song-title">设置课题分</h2>
        </div>
        <div id="selected-song" class="selected-song"></div>
        <form id="topic-form" class="topic-form">
          <select id="topic-level" class="fantasy-select"></select>
          <input id="target-score" type="number" min="0" max="101" step="0.01" value="100.50" class="fantasy-input"
            placeholder="课题分">
          <input id="topic-note" class="fantasy-input topic-note-input" placeholder="备注，可留空" autocomplete="off">
          <button type="submit" class="fantasy-btn-submit">设为当前课题</button>
        </form>
      </div>

      <div id="search-status" class="arena-status"></div>
      <div class="arena-table-wrap search-table-wrap">
        <table class="fantasy-table arena-search-table">
          <colgroup>
            <col class="cover-col">
            <col class="song-col">
            <col class="artist-col">
            <col class="level-col">
            <col class="uploader-col">
            <col class="time-col">
            <col class="action-col">
          </colgroup>
          <thead>
            <tr>
              <th>封面</th>
              <th><button type="button" class="sort-header" data-sort-field="title">曲名</button></th>
              <th><button type="button" class="sort-header" data-sort-field="artist">作者</button></th>
              <th>等级</th>
              <th><button type="button" class="sort-header" data-sort-field="uploader">上传者</button></th>
              <th><button type="button" class="sort-header" data-sort-field="timestamp">更新</button></th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="search-results"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/arena.js"></script>
</body>

</html>
